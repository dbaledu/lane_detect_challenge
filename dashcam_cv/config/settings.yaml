# 도로주행 영상 기반 경량 자율주행 비전 분석 시스템 설정 파일 (dashcam_cv)

# ───────────────────────────────────────────────
# 0. 파이프라인 모듈 ON/OFF 스위치
#    true  = 해당 모듈 실행
#    false = 해당 모듈 건너뜀 (더미 결과로 대체)
# ───────────────────────────────────────────────
pipeline:
  use_lane_detection:   true   # 차선 검출 + 칼만 트래킹 (LaneDetector + LaneTracker)
  use_lane_change:      true   # 차선 변경 감지 (LaneChangeDetector)
  use_object_detector:  true    # 객체 검출 - objects_detector_th.py (ObjectDetector)
  use_object_tracker:   true    # 객체 추적 (부드러운 연속 추적 & 박스 허공 날림 방지)
  use_road_markings:    true    # 횡단보도 / 정지선 검출 (RoadMarkingDetector)
  use_motion_estimator: true   # 배경 광학흐름 추정 (MotionEstimator)
  use_decision_fusion:  true   # 주행 상태 판단 (DecisionFusion)

# 1. 동영상 입출력 설정
video:
  input_path: "data/Test_Video_2.mp4"
  output_video: "outputs/annotated_video.mp4"
  output_frame_log: "outputs/frame_log.csv"
  output_perf_log: "outputs/performance.csv"
  output_summary: "outputs/summary.json"
  target_width: 960          # 처리 해상도 (0이면 원본 크기, 960 or 640 권장)
  frame_stride: 1           # 프레임 건너뛰기 간격 (기본 1)
  max_frames: 0             # 0이면 전체 영상, 양수면 앞쪽 N 프레임만 처리 (테스트용)
  codec: "mp4v"             # 비디오 코덱 (mp4v, avc1 등)

# 2. 영상 품질 및 환경 분석 설정
quality:
  brightness_night_threshold: 70.0   # 평균 밝기 이하 시 야간 모드 판정
  blur_laplacian_threshold: 45.0     # 라플라시안 분산 이하 시 블러/흔들림 판정

# 3. 전처리 (Preprocessing) 설정
preprocessing:
  use_clahe: true                    # 야간 저조도 대비 향상을 위한 CLAHE 적용
  clahe_clip_limit: 2.5
  clahe_grid_size: [8, 8]
  gaussian_kernel: [5, 5]
  auto_canny: true                   # 중앙값 기반 동적 Canny 임계값 산출
  auto_canny_sigma: 0.33
  canny_low: 60
  canny_high: 150
  morph_close: true                  # 점선 연결을 위한 닫힘 연산

# 4. 관심 영역 (ROI) 설정 - cv1021.py 듀얼 ROI 및 컴팩트 Bounding Box
roi:
  top_ratio: 0.67           # 상단 높이 (y=0.67h)
  bottom_ratio: 0.86        # 하단 높이 (y=0.86h)
  bbox_scale_x: 0.72        # BBox 가로폭 28% 압축 비율
  top_left_ratio: 0.40      # 상단 좌측 x 비율
  top_right_ratio: 0.60     # 상단 우측 x 비율
  bottom_left_ratio: 0.28   # 하단 좌측 x 비율
  bottom_right_ratio: 0.72  # 하단 우측 x 비율

# 5. 차선 검출 및 추적 설정 (cv1021.py Canny + 허프 maxLineGap 60 + 4D Kalman Filter)
lane:
  hough_threshold: 25       # 허프 변환 임계값 (cv1021.py)
  min_line_length: 20       # 최소 선분 길이 (cv1021.py)
  max_line_gap: 60          # 끊어진 선분 연결 최대 간격 (cv1021.py)
  min_slope: 0.40           # 횡단보도 가로선 제거용 최소 기울기 (|기울기| < 0.40 제외)
  max_slope: 3.0            # 수직 노이즈 제거용 최대 기울기 (|기울기| > 3.0 제외)
  max_lost_frames: 30       # 차선 미검출 시 칼만 예측 유지 최대 프레임수 (30프레임)
  default_lane_width_ratio: 0.45  # 편측 검출 시 반대편 차선 추정용 기본 차로폭 비율
  min_confidence: 0.25      # 최소 유효 신뢰도
  roi_target_size: [320, 360]     # 독립 ROI 리사이즈 해상도


# 6. 차선 변경 감지 설정
lane_change:
  drift_threshold_px: 35.0  # 차선 중심 편차 드리프트 임계값
  candidate_frames: 3       # 변경 의심 진입 프레임수
  progress_frames: 7        # 변경 진행 판정 프레임수

# 7. 객체 검출 모델 설정 (objects_detector_th.py 듀얼 경로 및 야간 최적화 호환)
detector:
  enabled: true
  backend: "ultralytics"           # "ultralytics", "opencv_dnn", "none", "auto"
  model_name: "yolo26n.pt"         # 사용할 YOLO 모델 가중치 (Nano 모델)
  detect_interval: 5               # N프레임마다 1회 추론 (중간 프레임은 트래커 보간)

  # 일반 객체(보행자, 자전거, 승용차, 오토바이, 버스, 트럭) 설정
  confidence_threshold: 0.22        # 일반 객체 신뢰도 임계값 (CONF=0.22)
  person_confidence_threshold: 0.22 # 보행자 검출 신뢰도 임계값
  iou_threshold: 0.45              # NMS IoU 임계값
  target_classes: [0, 1, 2, 3, 5, 7, 9] # 0:person, 1:bicycle, 2:car, 3:motorcycle, 5:bus, 7:truck, 9:traffic light

  # 해상도 및 영상 영역 최적화
  imgsz_gpu: 640                   # 일반 객체 GPU 입력 해상도
  imgsz_cpu: 480                   # 일반 객체 CPU 입력 해상도
  hood_crop_ratio: 0.15            # 하단 본네트 영역 제거 비율 (하단 15% 크롭)

  # 야간 전처리 설정 (신호등 제외 일반 객체 경로에만 적용)
  enable_enhance: true             # L 채널 감마 + CLAHE 전처리 활성화
  night_enhancer:
    gamma: 0.8                     # 감마 보정 계수 (어두운 영역 개선)
    clip_limit: 2.0                # CLAHE 대비 제한 계수
    tile_grid_size: [8, 8]         # CLAHE 타일 격자 크기

  # 신호등 전용 경로 (상단 고해상도 ROI + 램프 색/형상 검증)
  traffic_light:
    enabled: true                   # 신호등 전용 듀얼 경로 활성화 여부
    class_id: 9                    # COCO 신호등 클래스 번호
    roi_ratio: 0.6                 # 본네트 제거 후 화면 상단 탐색 영역 비율 (상위 60%)
    imgsz_gpu: 1280                # 신호등 탐색 영역 고해상도 입력 (GPU)
    imgsz_cpu: 640                 # 신호등 탐색 영역 고해상도 입력 (CPU)
    confidence_threshold: 0.10     # 낮은 신뢰도로 후보 수집 (오검출은 아래 필터로 제거)
    max_aspect_ratio: 5.0          # 박스 종횡비(긴변/짧은변) 최대 허용 비율 (가로형 건물 조명 제거)
    min_saturation: 80             # 램프 픽셀 최소 채도 (백색 조명 제외)
    min_value: 140                 # 램프 픽셀 최소 밝기
    min_lamp_ratio: 0.03           # 박스 면적 대비 밝은 적/황/녹 램프 픽셀 최소 비율 (3%)

  # 화면 표시 및 바운딩 박스 색상 설정
  display_max_width: 1280          # 화면 표시 최대 가로 해상도
  show_fps: true                   # 화면 좌측 상단 FPS 표시 여부
  colors:
    object: [0, 255, 255]          # 일반 객체 박스 색상 (BGR: 노란색)
    traffic_light: [0, 255, 0]     # 신호등 박스 색상 (BGR: 녹색)

# 8. 객체 추적기 설정 (부드러운 EMA 보간 & 이상 속도 억제 트래커)
tracker:
  max_distance_px: 90
  max_missed_frames: 10
  lead_vehicle_corridor_margin_px: 130 # 내 주행 차로 내 선행 차량 판별 여유폭
  ema_alpha: 0.65                       # 신규 검출 반영 비율 (0.65: 떨림 방지 및 부드러운 박스 추종)
  velocity_decay: 0.88                  # 프레임 간 속도 감쇠율 (미검출 시 허공 날림 방지)
  max_speed_px: 15.0                    # 1프레임당 최대 이동 허용 속도 (이상치 차단)

# 9. 횡단보도 및 정지선 검출 설정
road_markings:
  enable: true
  crosswalk_min_stripes: 3  # 최소 평행 줄무늬 개수
  stopline_min_width_ratio: 0.25 # 차로 대비 최소 수평선 폭 비율
  stopline_max_slope: 0.20  # 가로 수평선 최대 허용 기울기

# 10. 주행 상태 판단 설정 (광학 흐름 및 상태 머신)
state:
  flow_max_features: 150    # 광학 흐름 추적 특징점 최대 개수
  flow_stopped_threshold: 0.85 # 배경 광학 흐름 크기가 이 값 미만이면 정지 의심
  flow_decel_slope: -0.04   # 시간 창 내 이동량 기울기가 음수일 때 감속 의심
  flow_start_threshold: 1.25 # 정지 후 재출발 판정 임계값
  window_size_frames: 25    # 상태 판별용 시계열 시간 창 (약 0.8초)
  stopped_persistence_frames: 15 # 정지 상태 확정 필요 최소 프레임수
  # 깜빡임(Flickering) 방지 및 안정화 설정
  state_hold_frames: 12     # 경고/감속/정지 상태 전환 시 최소 유지 프레임수 (~0.4초)
  state_debounce_frames: 2  # 일시적 노이즈 차단을 위한 전환 확정 필요 연속 프레임수
  # 신호등 불빛 감지 (Traffic Light) 설정
  traffic_light:
    roi_top: 0.10             # 상위 10%부터 (상단 배제)
    roi_bottom: 0.50          # 상위 50%까지 (하단 차량 후미등 배제)
    roi_left: 0.15            # 좌측 15%부터 (도로변 좌측 상가 간판 배제)
    roi_right: 0.85           # 우측 85%까지 (도로변 우측 전광판/가로등 배제)
    min_saturation: 120       # 최소 채도 (전광판 백색광 배제)
    min_value: 180            # 최소 밝기 (어두운 노이즈/가로등 배제)
    debounce_frames: 2        # 안정화를 위한 연속 감지 프레임수

# 11. 시각화 (HUD) 설정
visualization:
  display_window: false     # 실시간 GUI 창 표시 여부 (헤드리스 환경에서는 false 권장)
  show_lane_polygon: true   # 주행 영역 반투명 채우기
  show_center_path: true    # 주행 중심 경로선 표시
  show_hud_card: true       # 주행 상태 및 지표 대시보드 표시
  show_debug_minimap: false  # 우측 상단 ROI 에지 미니맵 표시
  show_objects: true        # 객체 검출 바운딩 박스 표시 여부
  show_object_labels: false  # 객체 검출 바운딩 박스 라벨(태그 텍스트) 표시 여부
