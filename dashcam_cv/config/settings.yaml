# 도로주행 영상 기반 경량 자율주행 비전 분석 시스템 설정 파일 (dashcam_cv)

# 1. 동영상 입출력 설정
video:
  input_path: "data/Test_Video_2.mp4"
  output_video: "outputs/annotated_video.mp4"
  output_frame_log: "outputs/frame_log.csv"
  output_perf_log: "outputs/performance.csv"
  output_summary: "outputs/summary.json"
  target_width: 960          # 처리 해상도 (0이면 원본 크기, 960 or 640 권장)
  frame_stride: 1           # 프레임 건너뛰기 간격 (기본 1)
  max_frames: 0             # 0이면 전체 영상, 양수면 앞쪽 N 프레임만 처리 (테스트용)
  codec: "mp4v"             # 비디오 코덱 (mp4v, avc1 등)

# 2. 영상 품질 및 환경 분석 설정
quality:
  brightness_night_threshold: 70.0   # 평균 밝기 이하 시 야간 모드 판정
  blur_laplacian_threshold: 45.0     # 라플라시안 분산 이하 시 블러/흔들림 판정

# 3. 전처리 (Preprocessing) 설정
preprocessing:
  use_clahe: true                    # 야간 저조도 대비 향상을 위한 CLAHE 적용
  clahe_clip_limit: 2.5
  clahe_grid_size: [8, 8]
  gaussian_kernel: [5, 5]
  auto_canny: true                   # 중앙값 기반 동적 Canny 임계값 산출
  auto_canny_sigma: 0.33
  canny_low: 60
  canny_high: 150
  morph_close: true                  # 점선 연결을 위한 닫힘 연산

# 4. 관심 영역 (ROI) 설정 - cv1021.py 듀얼 ROI 및 컴팩트 Bounding Box
roi:
  top_ratio: 0.67           # 상단 높이 (y=0.67h)
  bottom_ratio: 0.86        # 하단 높이 (y=0.86h)
  bbox_scale_x: 0.72        # BBox 가로폭 28% 압축 비율
  top_left_ratio: 0.40      # 상단 좌측 x 비율
  top_right_ratio: 0.60     # 상단 우측 x 비율
  bottom_left_ratio: 0.28   # 하단 좌측 x 비율
  bottom_right_ratio: 0.72  # 하단 우측 x 비율

# 5. 차선 검출 및 추적 설정 (cv1021.py Canny + 허프 maxLineGap 60 + 4D Kalman Filter)
lane:
  detector: "lanes_detector_v1_em"     # lane_line 또는 lanes_detector_v1_em
  hough_threshold: 25       # 허프 변환 임계값 (cv1021.py)
  min_line_length: 20       # 최소 선분 길이 (cv1021.py)
  max_line_gap: 60          # 끊어진 선분 연결 최대 간격 (cv1021.py)
  min_slope: 0.40           # 횡단보도 가로선 제거용 최소 기울기 (|기울기| < 0.40 제외)
  max_slope: 3.0            # 수직 노이즈 제거용 최대 기울기 (|기울기| > 3.0 제외)
  max_lost_frames: 30       # 차선 미검출 시 칼만 예측 유지 최대 프레임수 (30프레임)
  default_lane_width_ratio: 0.45  # 편측 검출 시 반대편 차선 추정용 기본 차로폭 비율
  min_confidence: 0.25      # 최소 유효 신뢰도
  roi_target_size: [320, 360]     # 독립 ROI 리사이즈 해상도


# 6. 차선 변경 감지 설정
lane_change:
  drift_threshold_px: 55.0  # 차선 중심 편차 드리프트 임계값
  candidate_frames: 4       # 변경 의심 진입 프레임수
  progress_frames: 10        # 변경 진행 판정 프레임수

# 7. 객체 검출 모델 설정 (경량화 최적화)
detector:
  enabled: true
  backend: "auto"           # "ultralytics", "opencv_dnn", "none", "auto"
  model_name: "yolo26n.pt"  # 경량 Nano 모델 (yolov8n.pt, yolo11n.pt)
  confidence_threshold: 0.35
  person_confidence_threshold: 0.22 # 횡단보도/도로 위 보행자 검출 전용 낮은 임계값
  iou_threshold: 0.45
  detect_interval: 5        # N프레임마다 1회 추론 (중간 프레임은 트래커 보간)
  target_classes: [0, 1, 2, 3, 5, 7, 9] # person, bicycle, car, motorcycle, bus, truck, traffic light

# 8. 객체 추적기 설정 (Centroid & IoU 기반 경량 트래커)
tracker:
  max_distance_px: 85
  max_missed_frames: 10
  lead_vehicle_corridor_margin_px: 130 # 내 주행 차로 내 선행 차량 판별 여유폭

# 9. 횡단보도 및 정지선 검출 설정
road_markings:
  enable: true
  stopline_min_width_ratio: 0.25 # 차로 대비 최소 수평선 폭 비율
  stopline_max_slope: 0.20  # 가로 수평선 최대 허용 기울기
  stopline_max_jump_ratio: 0.035 # 이전 위치 대비 허용 최대 Y 이동비율
  stopline_smooth_frames: 7 # 정지선 Y/좌우 좌표 중앙값 평활 프레임
  stopline_hold_frames: 4 # 후보 검출 실패 시 마지막 위치 유지 프레임
  stopline_max_x_jump_ratio: 0.08 # 이전 박스 중심 대비 허용 최대 좌우 이동비율

# 10. 주행 상태 판단 설정 (광학 흐름 및 상태 머신)
state:
  flow_max_features: 150    # 광학 흐름 추적 특징점 최대 개수
  flow_stopped_threshold: 0.35 # 배경 광학 흐름 크기가 이 값 미만이면 정지 의심
  flow_decel_slope: -0.04   # 시간 창 내 이동량 기울기가 음수일 때 감속 의심
  flow_start_threshold: 1.25 # 정지 후 재출발 판정 임계값
  window_size_frames: 25    # 상태 판별용 시계열 시간 창 (약 0.8초)
  stopped_persistence_frames: 15 # 정지 상태 확정 필요 최소 프레임수
  # 깜빡임(Flickering) 방지 및 안정화 설정
  state_hold_frames: 12     # 경고/감속/정지 상태 전환 시 최소 유지 프레임수 (~0.4초)
  state_debounce_frames: 2  # 일시적 노이즈 차단을 위한 전환 확정 필요 연속 프레임수
  # 신호등 불빛 감지 (Traffic Light) 설정
  traffic_light:
    roi_top: 0.10             # 상위 10%부터 (상단 배제)
    roi_bottom: 0.50          # 상위 50%까지 (하단 차량 후미등 배제)
    roi_left: 0.15            # 좌측 15%부터 (도로변 좌측 상가 간판 배제)
    roi_right: 0.85           # 우측 85%까지 (도로변 우측 전광판/가로등 배제)
    min_saturation: 120       # 최소 채도 (전광판 백색광 배제)
    min_value: 180            # 최소 밝기 (어두운 노이즈/가로등 배제)
    debounce_frames: 2        # 안정화를 위한 연속 감지 프레임수

# 11. 시각화 (HUD) 설정
visualization:
  display_window: false     # 실시간 GUI 창 표시 여부 (헤드리스 환경에서는 false 권장)
  show_lane_polygon: true   # 주행 영역 반투명 채우기
  show_center_path: true    # 주행 중심 경로선 표시
  show_hud_card: true       # 주행 상태 및 지표 대시보드 표시
  show_debug_minimap: true  # 우측 상단 ROI 에지 미니맵 표시
  show_objects: true       # 객체 검출 바운딩 박스 표시 여부
  show_object_labels: true  # 객체 검출 바운딩 박스 라벨(태그 텍스트) 표시 여부
